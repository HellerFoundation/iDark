<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
    <header class="header">
        <div class="brand">
            <span class="moon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </span>
            <div class="brand-text">
                <span class="brand-title">NightRiding</span>
                <span class="brand-sub" id="site-name">This site</span>
            </div>
        </div>
        <label class="switch" title="Dark Mode (all sites)">
            <input type="checkbox" id="master-toggle">
            <span class="track"><span class="thumb"></span></span>
        </label>
    </header>

    <section class="section site-row">
        <div class="site-label">
            <span class="site-title">Dark Mode on this site</span>
            <span class="site-detail" id="site-detail">Enabled</span>
        </div>
        <label class="switch small" title="Toggle Dark Mode for this site">
            <input type="checkbox" id="site-toggle">
            <span class="track"><span class="thumb"></span></span>
        </label>
    </section>

    <section class="section" id="adjustments">
        <div class="row">
            <label for="brightness">Brightness</label>
            <span class="value" id="brightness-val">88%</span>
        </div>
        <input type="range" id="brightness" min="0.4" max="1.4" step="0.01">

        <div class="row">
            <label for="contrast">Contrast</label>
            <span class="value" id="contrast-val">100%</span>
        </div>
        <input type="range" id="contrast" min="0.6" max="1.4" step="0.01">

        <div class="row">
            <label for="saturation">Saturation</label>
            <span class="value" id="saturation-val">1.0×</span>
        </div>
        <input type="range" id="saturation" min="0.1" max="2" step="0.05">

        <div class="row">
            <label for="warmth">Warmth</label>
            <span class="value" id="warmth-val">0%</span>
        </div>
        <input type="range" id="warmth" min="0" max="0.3" step="0.01">
    </section>

    <footer class="footer">
        <div class="footer-actions">
            <button type="button" id="reset-look" class="btn">Reset Look</button>
            <button type="button" id="reset-all" class="btn">Reset All</button>
        </div>
        <span class="hint">Your look applies to every site</span>
    </footer>
</body>
</html>
